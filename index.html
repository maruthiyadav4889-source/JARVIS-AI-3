<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChatGPT</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Header -->
  <header class="chatgpt-header">
    <button class="nav-icon-btn" id="sidebarBtn" title="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>
    
    <div class="model-selector">
      <span>ChatGPT</span>
      <span class="version-tag">4o mini</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M7 10l5 5 5-5z"/>
      </svg>
    </div>

    <button class="nav-icon-btn" id="newChatBtn" title="New Chat">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
      </svg>
    </button>
  </header>

  <!-- Main Chat Conversation Feed -->
  <main class="chat-container" id="chatFeed">
    
    <!-- Empty State Welcome Prompt -->
    <div class="welcome-section" id="welcomeSection">
      <div class="chatgpt-logo-badge">
        <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <h2>What can I help with?</h2>
      
      <div class="prompt-chips">
        <button class="chip-btn" onclick="setPrompt('Solve this assignment step-by-step: ')">📝 Solve Assignment</button>
        <button class="chip-btn" onclick="openCameraDirectly()">📸 Scan Photo / Homework</button>
        <button class="chip-btn" onclick="setPrompt('Pay 500 to ')">💸 Send UPI Payment</button>
        <button class="chip-btn" onclick="setPrompt('Write a Python script for ')">💻 Code Assistant</button>
      </div>
    </div>

  </main>

  <!-- Attachment Drawer / Preview -->
  <div id="imagePreviewContainer" class="attachment-preview" style="display: none;">
    <div class="preview-card">
      <img id="previewImg" src="" alt="Thumbnail" />
      <span id="imageName">Attachment ready</span>
      <button id="removeImageBtn" class="close-attachment-btn">&times;</button>
    </div>
  </div>

  <!-- Bottom Message Input Dock -->
  <footer class="input-dock">
    <div class="input-wrapper">
      
      <!-- Hidden File & Camera Selectors -->
      <input type="file" id="fileInput" accept="image/*" style="display: none;" />
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" />

      <!-- Action / Media + Button -->
      <button class="icon-btn plus-btn" id="attachBtn" title="Attach image or take photo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
      </button>

      <!-- Dynamic Resizing Input -->
      <textarea id="userInput" class="chat-input" placeholder="Message ChatGPT..." rows="1"></textarea>

      <!-- Microphone STT Button -->
      <button class="icon-btn mic-btn" id="micBtn" title="Voice Input">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
        </svg>
      </button>

      <!-- Send Button -->
      <button class="icon-btn send-btn" id="sendBtn" title="Send message">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>

    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
