<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jarvis AI 1.0</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Gemini Header -->
  <header class="gemini-header">
    <div class="logo-group">
      <svg class="gemini-sparkle" viewBox="0 0 24 24">
        <defs>
          <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4285f4"/>
            <stop offset="50%" stop-color="#9b72cb"/>
            <stop offset="100%" stop-color="#d96570"/>
          </linearGradient>
        </defs>
        <path fill="url(#sparkle-grad)" d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
      </svg>
      <span class="app-title">Jarvis AI</span>
      <span class="version-tag">1.0</span>
    </div>
    
    <button class="upi-config-btn" id="upiConfigBtn" title="Set UPI ID">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>
      </svg>
    </button>
  </header>

  <!-- Chat & Suggestions Feed -->
  <main class="chat-feed" id="chatFeed">
    
    <!-- Gemini Welcome Screen -->
    <div class="welcome-container" id="welcomeContainer">
      <div class="greeting-box">
        <span class="gradient-text">Hello, Boss</span>
        <h2>How can I help you today?</h2>
      </div>

      <div class="suggestions-grid">
        <div class="suggestion-card" data-prompt="Solve this assignment step-by-step: ">
          <span class="card-icon">📐</span>
          <p>Solve assignment with steps</p>
        </div>
        <div class="suggestion-card" onclick="openCameraDirectly()">
          <span class="card-icon">📸</span>
          <p>Scan photo or homework</p>
        </div>
        <div class="suggestion-card" data-prompt="Pay 500 to ">
          <span class="card-icon">💸</span>
          <p>Send instant UPI payment</p>
        </div>
        <div class="suggestion-card" data-prompt="Write clean, commented Python code for ">
          <span class="card-icon">💻</span>
          <p>Write & debug code</p>
        </div>
      </div>
    </div>

  </main>

  <!-- Attachment Preview Drawer -->
  <div id="imagePreviewContainer" class="attachment-preview" style="display: none;">
    <div class="preview-card">
      <img id="previewImg" src="" alt="Thumbnail" />
      <span id="imageName">Attachment loaded</span>
      <button id="removeImageBtn" class="close-btn">&times;</button>
    </div>
  </div>

  <!-- Bottom Gemini Input Dock -->
  <footer class="input-dock">
    <div class="input-card">
      
      <!-- Hidden System Inputs -->
      <input type="file" id="fileInput" accept="image/*" style="display: none;" />
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" />

      <!-- Photo / Camera Attachment Button -->
      <button class="action-btn attach-btn" id="attachBtn" title="Camera or Gallery">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
          <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
        </svg>
      </button>

      <!-- Expandable Prompt Box -->
      <textarea id="userInput" class="chat-textarea" placeholder="Ask Jarvis AI 1.0..." rows="1"></textarea>

      <!-- Voice Microphone -->
      <button class="action-btn mic-btn" id="micBtn" title="Voice Input">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
        </svg>
      </button>

      <!-- Submit Directive -->
      <button class="action-btn send-btn" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>

    </div>
    <div class="disclaimer">Jarvis AI 1.0 Mobile Edition &bull; Device Bridge Active</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
